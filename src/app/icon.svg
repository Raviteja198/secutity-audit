    <rect x="10.5" y="38" width="10" height="10" rx="4.2"/>
    <circle cx="32" cy="23" r="4.3"/>
    <rect x="27" y="31.5" width="10" height="16.5" rx="4.2"/>
  </g>
  <g fill="#6ee7b7">
    <circle cx="48.5" cy="16.5" r="4.3"/>
    <rect x="43.5" y="25" width="10" height="23" rx="4.2"/>
  </g>
</svg>
